name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # This is a *private* build container.
    # See docs/github_actions.md for more information.
    container: ghcr.io/rjkiv/rb3-xenon-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add game versions here
        version: [45410914]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -R /orig .

    # Guard: prove our binary-scanning methods can still FIND things in binaries.
    # A binary-blind grep yields only FALSE NEGATIVES (silent, exit 1), which is
    # the shape of a "decisive negative" and has already closed a repairable row.
    # Runs after Prepare so the band.exe cross-check is exercised too.
    - name: Grep binary guard
      run: python3 tools/grep_binary_guard.py -v

    # Guard: a unit's progress_category must agree with its source PATH. The tag
    # used to be objects.json library-group membership with nothing tying it to
    # the tree, so it drifted silently for 10 objects -- 13,692 B of src/band3/
    # game code counted as engine, and the whole `xdk` group counted as engine
    # rather than sdk. It is derived now (tools/source_category.py), and this
    # step fails on any category<->scope_map tier pair outside the documented
    # CATEGORY_ALLOWED_TIERS granularity table. `selftest` first: it pins 23
    # known-answer cases including nine negatives, so a classifier that has
    # stopped discriminating fails here rather than silently passing `audit`.
    # (VENDTIER-1 added the `thirdparty` tier and, with it, the four .cpp files
    # that live INSIDE vendored C libraries but are Harmonix glue -- those are
    # the negatives that stop the rule collapsing into "anything under a vendor
    # directory is third-party", which is the bug the tier split could have
    # introduced. It also TIGHTENED engine's allowed tiers to {"engine"}: the
    # old {"engine","thirdparty"} entry was a blanket exemption that let 30
    # rows sit mis-tiered without the audit saying a word.)
    - name: Progress-category derivation guard
      run: |
        python3 tools/source_category.py selftest
        python3 tools/source_category.py audit

    # Build the project
    - name: Build
      run: |
        python configure.py --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source progress build/${{ matrix.version }}/report.json

    # Guard: the scope-cache gate must DISCRIMINATE.  `validate-addrs`
    # recomputes its address invariants from report.json and for months never
    # opened config/45410914/scope_map.json at all, so it reported PASS/exit 0
    # over a stale fabricating artifact AND over a DELETED one -- two green
    # signals for one bad cache.  This selftest synthesises stale/dead/correct
    # fixtures deterministically from report.json (no preserved incident file,
    # which is why it can run here) and asserts the gate fails the bad ones and
    # PASSES the correct one -- the control is half the evidence, since a gate
    # that fails on everything proves nothing.  Runs after Build because it
    # needs report.json.
    - name: Scope-cache gate discrimination selftest
      run: python3 tools/scope_map.py selftest

    # Guard: a COFF relocation's SymbolTableIndex COUNTS AUX RECORDS, so
    # indexing an aux-free symbol list returns a GARBAGE NAME.  Measured: only
    # 20.99% of relocations resolve correctly without a correction.  The bug has
    # shipped three times and always as a SILENT FALSE NEGATIVE.  Runs AFTER
    # Build so the real-obj cross-check is exercised, not just the fixture.
    - name: Reloc symbol-index guard
      run: python3 tools/reloc_symidx_guard.py -v

    # Guard: ICF FOLD POISONING.  One retail address serves many functions, so
    # target_symbol_map.json names it with ONE arbitrary survivor spelling, and
    # any name comparison conflates "folded" with "wrong".  This defect was
    # found, documented, fixed -- and REBUILT ONE DAY LATER by a new scan whose
    # author had personally fixed it, because a helper you must remember to call
    # is not a guard.  tools/icf_fold_safe.py makes the unsafe comparison RAISE.
    # Fixtures are real retail bytes (XboxContent @ 0x8208968c slot 3), and
    # --self-break proves the gate can fail.  See
    # docs/decomp/patterns/icf-fold-poisoning.md.
    - name: ICF fold-poisoning guard
      run: |
        python3 tools/test_icf_fold_safe.py
        python3 tools/test_icf_fold_safe.py --self-break

    # Guard: every ICF alias group in scripts/symbol_aliases.json must be
    # GROUNDED.  Under the shipped functionRelocDiffs=name_check ruler an alias
    # is pure FORGIVENESS -- objdiff consults SymbolEquivalences and drops the
    # charge -- so an UNPROVEN alias lifts matched_code BY CONSTRUCTION, with no
    # byte evidence, and the `none` control CANNOT catch it (none ignores
    # relocation names, so a fabricated alias reads +0 there by construction).
    # This is therefore the one data file where "the score went up" is not
    # evidence of anything, and a gate is the only defence.
    #
    # Nothing ran this before.  The only shipped alias gate was
    # `gen_symbol_alias_map.py --check`, which asserts the rendered .map is
    # FRESH w.r.t. the JSON -- a staleness check that says nothing about whether
    # the groups are true.  --validate was hand-run only, and emitted 221
    # undifferentiated failures out of 1,499, so it was ignored; 211 of those
    # were the checker's own bugs and they hid the 10 that were real (lane
    # ALIASVAL-1, which fixed the checker and withdrew 6 groups worth 944 B of
    # fabricated credit).  Failure is now reserved for CONTRADICTED -- two
    # shipped data files disagreeing -- and the tolerated classes are printed
    # with counts and reasons on every run.
    #
    # Runs AFTER Build: the pre-compile obj_target_symbol_renamer must have
    # populated the target objs' mangled names, or the check would be vacuous.
    # It does not merely assume that -- it REFUSES with exit 2 if the target
    # objs still carry dtk's anonymous `fn_<addr>` symbols, which is what a
    # fresh worktree looks like and what used to read as "1499 groups failing".
    - name: ICF alias grounding guard
      run: python3 tools/icf_alias_finder.py --validate

    # Guard: config/<version>/symbols.txt is BOTH an input to dtk's SPLIT and an
    # output of it, so "correct" means FIXED POINT.  When the committed file is
    # off jeff's fixpoint, dtk carves function boundaries it would immediately
    # revise -- an over-fragmented row can never equal the retail function, so
    # its bytes never enter matched_code.  Re-carving to the fixpoint was worth
    # +2 matched / +292 B at a08f0fd2, and that was the SECOND time (954c01f8).
    # It recurs because splits.txt span extensions and target_symbol_map.json
    # row removals both feed jeff's merge derivation.
    #
    # The guard FORCES its own re-split (~10s) rather than trusting that the
    # Build step split: a plain `git diff --quiet` CANNOT FAIL when SPLIT did not
    # run, which is how lane DA-1's first check passed vacuously.  It fails
    # loudly if the SPLIT edge is absent.  Prove it can fail:
    #   python3 tools/symbols_fixpoint_guard.py --self-break
    - name: symbols.txt fixpoint guard
      run: python3 tools/symbols_fixpoint_guard.py -v --ci --version ${{ matrix.version }}

    # # Upload map files
    # - name: Upload map
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ${{ matrix.version }}_maps
    #     path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json
